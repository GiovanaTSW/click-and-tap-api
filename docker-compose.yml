# API + PostgreSQL for local runs and demos.
#   1. Copy .env.example to .env and fill in the empty values.
#   2. docker compose up --build
# The API is then available at http://localhost:8088 (change API_PORT in .env to move it).

name: click-and-tap

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clickandtap}
      POSTGRES_USER: ${POSTGRES_USER:-clickandtap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep their data in a versioned folder under /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # The database is only reachable from the API container: no port is published to the host.

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: pdn
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-clickandtap}
      DB_USER: ${POSTGRES_USER:-clickandtap}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      - "${API_PORT:-8088}:8080"

volumes:
  db-data:
