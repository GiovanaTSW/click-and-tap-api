name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # gradlew is stored without the executable bit when committed from Windows.
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Runs unit and integration tests. The integration tests start PostgreSQL with Testcontainers,
      # and GitHub's ubuntu runners already provide Docker.
      - name: Build and run all tests
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/

  docker:
    name: Docker image and smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Throwaway secrets that exist only for this run.
      - name: Create .env
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "ADMIN_EMAIL=ci-admin@example.com"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 12)"
            echo "SWAGGER_ENABLED=true"
          } > .env

      - name: Build images and start the stack
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://localhost:8088/actuator/health
          echo
          curl --fail --silent --show-error "http://localhost:8088/api/products?size=1"
          echo
          curl --fail --silent --show-error --output /dev/null http://localhost:8088/v3/api-docs
          # Without a token the protected API must answer 401, never 200 or 500.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8088/api/orders)" = "401"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
