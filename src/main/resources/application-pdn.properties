# Production profile: every value comes from environment variables. Nothing secret lives in the repository.
# Variables without a default (DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGINS)
# are required: the application fails to start if any of them is missing.

# Run behind a reverse proxy (Nginx, Caddy, platform router) that terminates TLS.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT_SECRET must be a random string of at least 32 characters (HS256).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Comma-separated list, for example https://app.clickandtap.mx
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Optional admin bootstrap: created on startup only if the email does not exist yet.
app.admin.name=${ADMIN_NAME:Admin}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.seed-sample-data=false
