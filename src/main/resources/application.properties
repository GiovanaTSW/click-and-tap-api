spring.application.name=click-and-tap-api

# Used only when no profile is set. In production set SPRING_PROFILES_ACTIVE=pdn.
spring.profiles.default=dev

# Only /actuator/health is exposed, without details. Docker and load balancers use it.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# The Hibernate session lives only inside service/repository transactions, never while the response
# is being written. Lazy collections are mapped to domain objects inside those transactions.
spring.jpa.open-in-view=false
# When a lazy collection is read, load it for up to 50 parents at once (avoids one query per order).
spring.jpa.properties.hibernate.default_batch_fetch_size=50
