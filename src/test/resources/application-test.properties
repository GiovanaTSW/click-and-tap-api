# Profile used by the integration tests. Everything here is fake and test-only, so the tests run
# on any machine and in CI without the git-ignored application-dev.properties.
# The datasource comes from the PostgreSQL container (see IntegrationTestBase).

jwt.secret=test-only-secret-with-at-least-32-characters-0123456789
jwt.expiration-ms=3600000
cors.allowed-origins=http://localhost:3000

# Admin created at startup by DataInitializer in the fresh test database.
app.admin.name=Test Admin
app.admin.email=admin@test.local
app.admin.password=admin-password-123
app.seed-sample-data=false

spring.jpa.show-sql=false
